<!doctype html>
<html lang="id">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Checkout | INTAN SHOP</title><link rel="stylesheet" href="css/variables.css" /><link rel="stylesheet" href="css/main.css" /><link rel="stylesheet" href="css/components.css" /><link rel="stylesheet" href="css/pages.css" /><link rel="stylesheet" href="css/responsive.css" /></head>
  <body><nav class="navbar-luxury"><div class="navbar-container"><a href="index.html" class="logo">INTAN <span>SHOP</span></a></div></nav><main class="page-shell container"><div class="page-header fade-up"><h1 class="font-serif">Checkout</h1><p>Lengkapi data pengiriman Anda untuk memastikan pesanan diproses dengan aman.</p></div><div class="cart-layout"><form id="checkout-form" class="form-card fade-up"><div class="form-grid"><div><label>Nama Lengkap</label><input id="checkout-name" required /></div><div><label>Email</label><input id="checkout-email" type="email" required /></div><div><label>No. HP</label><input id="checkout-phone" required /></div><div><label>Alamat</label><input id="checkout-address" required /></div><div><label>Provinsi</label><input id="checkout-province" required /></div><div><label>Kabupaten</label><input id="checkout-city" required /></div><div><label>Kecamatan</label><input id="checkout-district" required /></div><div><label>Kode Pos</label><input id="checkout-zip" required /></div></div><label class="mt-3">Catatan</label><textarea id="checkout-notes"></textarea><button class="btn mt-4" type="submit">Lanjut ke Pembayaran</button></form><div class="order-summary fade-up"><h3>Order Review</h3><div id="checkout-review"></div></div></div></main><script src="js/products-data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script><script src="js/app.js"></script></body></html>
