  <body><nav class="navbar-luxury"><div class="navbar-container"><a href="index.html" class="logo">INTAN <span>SHOP</span></a><div class="hamburger" id="hamburger-menu"><span></span><span></span><span></span></div><div class="nav-links" id="nav-links"><a href="index.html">Home</a><a href="product.html" class="active">Shop</a><a href="wishlist.html">Wishlist</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="cart.html">Cart <span class="cart-badge">0</span></a><a href="account.html">Account</a><a href="admin-dashboard.html" class="nav-auth btn-outline">Admin</a></div></div></nav><main class="page-shell container"><header class="page-header fade-up"><h1 class="font-serif">Luxury Collection</h1><p>Temukan 48 item premium dengan fitur pencarian real-time, filter kategori, rating, stok, dan sorting yang dapat dipakai langsung.</p></header><div class="catalog-layout"><aside class="sidebar fade-up"><div class="filter-group"><h4>Search</h4><input id="search-input" type="text" placeholder="Cari nama, kategori, SKU" /></div><div class="filter-group"><h4>Category</h4><label><input type="radio" name="category" value="all" checked /> Semua</label><label><input type="radio" name="category" value="diamond" /> Diamond</label><label><input type="radio" name="category" value="gold jewelry" /> Gold Jewelry</label><label><input type="radio" name="category" value="ring" /> Ring</label><label><input type="radio" name="category" value="bracelet" /> Bracelet</label><label><input type="radio" name="category" value="necklace" /> Necklace</label><label><input type="radio" name="category" value="luxury bag" /> Luxury Bag</label><label><input type="radio" name="category" value="watch" /> Watch</label><label><input type="radio" name="category" value="gift collection" /> Gift Collection</label></div><div class="filter-group"><h4>Price</h4><select id="price-filter"><option value="all">Semua</option><option value="under-5m">Di bawah 5 juta</option><option value="5m-10m">5 juta - 10 juta</option><option value="above-10m">Di atas 10 juta</option></select></div><div class="filter-group"><h4>Rating</h4><select id="rating-filter"><option value="0">Semua</option><option value="4.5">4.5+</option><option value="4.7">4.7+</option><option value="4.9">4.9+</option></select></div><div class="filter-group"><h4>Stock</h4><select id="stock-filter"><option value="all">Semua</option><option value="instock">Tersedia</option><option value="limited">Limited</option></select></div><div class="filter-group"><h4>Discount</h4><select id="discount-filter"><option value="all">Semua</option><option value="sale">Diskon</option></select></div><div class="filter-group"><h4>Sort</h4><select id="sort-filter"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="lowest">Lowest Price</option><option value="highest">Highest Price</option><option value="rating">Highest Rating</option><option value="az">A-Z</option><option value="za">Z-A</option></select></div></aside><section><div id="catalog-grid" class="catalog-grid"></div></section></div></main><script src="js/products-data.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/filter.js"></script><script src="js/main.js"></script><script src="js/app.js"></script></body></html>
